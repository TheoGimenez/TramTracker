syntax = "proto2";
package transit_realtime_min;
import "nanopb.proto";

message Feed {
  repeated Vehicle vehicle = 1 [(nanopb).type = FT_CALLBACK, (nanopb).max_count = 32];
  }

message Vehicle {
  required string id = 1;
  optional string trip_id = 2;
  optional string route_id = 3;
  optional double latitude = 4;
  optional double longitude = 5;
  optional uint32 current_stop_sequence = 6;
  optional string stop_id = 7;
}