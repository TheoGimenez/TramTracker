; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = denky32

extra_configs =
    config/secret.ini

[env:denky32]
platform = espressif32
board = denky32
framework = arduino
monitor_speed = 115200
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	nanopb/Nanopb@^0.4.91
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
	; esp32async/ESPAsyncWebServer@~3.11.1
	majicdesigns/MD_MAX72XX@^3.5.1
	majicdesigns/MD_Parola@^3.7.5
; debug_tool = esp-usb-bridge
; build_type = debug
monitor_filters = esp32_exception_decoder
; log2file
debug_tool = esp-prog
debug_init_break = tbreak setup

; platform_packages = 
;     espressif/toolchain-xtensa-esp32@12.2.0+20230208
build_flags =
    ; -std=gnu++23
    -std=c++2a
    ; -pedantic
    ; -Wextra           
    ; -Wconversion
    ; -O2
    ; -g
    '-D WIFI_SSID="${secret.WIFI_SSID}"'
    '-D WIFI_PASSWORD="${secret.WIFI_PASSWORD}"'
    -D WEBSERVER_PORT='${secret.WEBSERVER_PORT}'
build_unflags = 
    ; -fno-rtti    
    -std=gnu++11
    -std=gnu++17
; build_unflags = -Os
; build_flags = -O2