; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs=debug

extra_configs=
    config/common.ini
    config/secret.ini

;**************[release]**************;
[env:release]
platform=espressif32
board=esp32dev
framework=arduino
;framework=espressif32
monitor_speed=115200
lib_compat_mode=strict
lib_ldf_mode=chain
lib_deps=
	nanopb/Nanopb@^0.4.91
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
	majicdesigns/MD_MAX72XX@^3.5.1
	majicdesigns/MD_Parola@^3.7.5
build_flags =
    ; -std=gnu++23
    -std=c++2a
    ; -pedantic
    ; -Wextra
    ; -Wconversion
    -Os
    '-D WIFI_SSID="${secret.WIFI_SSID}"'
    '-D WIFI_PASSWORD="${secret.WIFI_PASSWORD}"'
    -D WEBSERVER_PORT='${secret.WEBSERVER_PORT}'
    '-D GTFS_BASE_URL="${common.GTFS_BASE_URL}"'
    '-D GTFS_TRIP_UPDATE_ENDPOINT="${common.GTFS_TRIP_UPDATE_ENDPOINT}"'
    '-D GTFS_VEHICLE_POSITION_ENDPOINT="${common.GTFS_VEHICLE_POSITION_ENDPOINT}"'
    '-D GTFS_ALERT_ENDPOINT="${common.GTFS_ALERT_ENDPOINT}"'
build_unflags=
; remove -fno-rtti if use of std::string or dynamic_cast cause error.
    -fno-rtti
    -std=gnu++11
    -std=gnu++17
;**************[end release]**************;

;**************[debug]**************;
[env:debug]
platform=espressif32
board=esp32dev
framework=arduino
;framework=espressif32
monitor_speed=115200
lib_compat_mode=strict
lib_ldf_mode=chain
lib_deps=
	nanopb/Nanopb@^0.4.91
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
	majicdesigns/MD_MAX72XX@^3.5.1
	majicdesigns/MD_Parola@^3.7.5
; https://docs.platformio.org/en/latest/plus/debug-tools/esp-prog.html
debug_tool=esp-prog
build_type=debug
monitor_filters=esp32_exception_decoder
; log2file
debug_init_break=tbreak setup
build_flags=
    -std=c++2a
    -g
    '-D WIFI_SSID="${secret.WIFI_SSID}"'
    '-D WIFI_PASSWORD="${secret.WIFI_PASSWORD}"'
    -D WEBSERVER_PORT='${secret.WEBSERVER_PORT}'
    '-D GTFS_BASE_URL="${common.GTFS_BASE_URL}"'
    '-D GTFS_TRIP_UPDATE_ENDPOINT="${common.GTFS_TRIP_UPDATE_ENDPOINT}"'
    '-D GTFS_VEHICLE_POSITION_ENDPOINT="${common.GTFS_VEHICLE_POSITION_ENDPOINT}"'
    '-D GTFS_ALERT_ENDPOINT="${common.GTFS_ALERT_ENDPOINT}"'
build_unflags=
; remove -fno-rtti if use of std::string or dynamic_cast cause error.
    -fno-rtti
    -std=gnu++11
    -std=gnu++17
;**************[end debug]**************;
